[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benelux-telegram-aggregator"
version = "0.1.0"
description = "MVP Telegram listings aggregator for the Benelux Russian-language marketplace group"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "google-genai>=2.17.0",
  "pydantic>=2.13.0",
  "python-dotenv>=1.2.0",
  "telethon>=1.44.0",
]

[project.scripts]
benelux-aggregator = "telegram_aggregator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
